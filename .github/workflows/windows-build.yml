name: Windows plugin build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3 and standalone
        run: cmake --build build --config Release --parallel
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Slate-Comp-Windows
          path: |
            build/SlateComp_artefacts/Release/VST3/
            build/SlateComp_artefacts/Release/Standalone/
          if-no-files-found: error
